<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Каталог учебных практик</title>
<style>
:root{--bg:#0a0c11;--s1:#12151c;--s2:#1a1e28;--line:#262b38;--tx:#e6e8ee;--mu:#8b93a7;--ac:#7c8cff;--ac2:#3dd6b0;--warn:#f0b35a;--bad:#f07a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
header{border-bottom:1px solid var(--line);background:var(--s1)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#0a0c11;font-style:normal;font-weight:800}
.prog{font-size:13px;color:var(--mu);min-width:200px}
.bar{height:6px;background:var(--s2);border-radius:9px;margin-top:5px;overflow:hidden}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));width:0;transition:width .3s}
.hero{padding:34px 0 10px}
h1{margin:0 0 8px;font-size:clamp(24px,4vw,34px);letter-spacing:-.5px}
.sub{color:var(--mu);max-width:620px;margin:0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 14px}
input,select{background:var(--s1);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 13px;font:inherit}
input{flex:1;min-width:200px}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--s1);color:var(--mu);padding:6px 13px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#0a0c11;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:.15s}
.card:hover{border-color:var(--ac);transform:translateY(-2px);background:var(--s2)}
.card h3{margin:0;font-size:16px}
.card p{margin:0;color:var(--mu);font-size:13.5px;flex:1}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mu)}
.tag{padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--s2);color:var(--ac)}
.lv-1{color:var(--ac2)}.lv-2{color:var(--warn)}.lv-3{color:var(--bad)}
.done{color:var(--ac2);font-weight:600}
.empty{color:var(--mu);padding:40px 0;text-align:center;grid-column:1/-1}
.back{display:inline-block;margin:24px 0 8px;color:var(--mu);font-size:14px}
.back:hover{color:var(--tx)}
.box{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.box h2{margin:0 0 10px;font-size:16px;color:var(--ac)}
.box p{margin:0}
ol{margin:0;padding-left:20px}ol li{margin:5px 0}
.code{position:relative}
pre{margin:0;background:#07080c;border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto;font:13px/1.6 ui-monospace,Consolas,Menlo,monospace;color:#cfd6ea}
.btn{background:var(--ac);color:#0a0c11;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.1)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
footer{border-top:1px solid var(--line);color:var(--mu);font-size:13px;padding:20px 0 30px;text-align:center}
</style>
</head>
<body>
<header><div class="wrap top">
<a href="#" class="logo"><i>К</i>Каталог практик</a>
<div class="prog"><span id="pt">Выполнено: 0 из 0</span><div class="bar"><b id="pb"></b></div></div>
</div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">Внутренний каталог учебных практик колледжа · дипломный проект</div></footer>

<script>
const P=[
{id:"js1",d:"JavaScript",lv:1,h:1,t:"Средний балл студента",s:"Функция расчёта среднего балла по массиву оценок.",
 g:"Научиться работать с массивами и методом reduce, обрабатывать пустой ввод.",
 st:["Создайте функцию average(grades).","Если массив пуст, верните 0.","Сложите оценки методом reduce.","Округлите результат до двух знаков."],
 c:String.raw`function average(grades) {
  if (!grades.length) return 0;
  const sum = grades.reduce((a, b) => a + b, 0);
  return Math.round((sum / grades.length) * 100) / 100;
}

console.log(average([5, 4, 4, 5, 3])); // 4.2
console.log(average([]));              // 0`},
{id:"js2",d:"JavaScript",lv:2,h:2,t:"Фильтрация списка студентов",s:"Поиск, фильтр и сортировка массива объектов.",
 g:"Закрепить методы filter, map, sort и работу с объектами.",
 st:["Создайте массив студентов с полями name, group, score.","Отфильтруйте студентов группы ИС-21.","Отсортируйте их по убыванию балла.","Выведите только имена."],
 c:String.raw`const students = [
  { name: "Айдар", group: "ИС-21", score: 4.5 },
  { name: "Мария", group: "ИС-22", score: 4.8 },
  { name: "Данияр", group: "ИС-21", score: 3.9 },
  { name: "Алина", group: "ИС-21", score: 4.9 }
];

const top = students
  .filter(s => s.group === "ИС-21")
  .sort((a, b) => b.score - a.score)
  .map(s => s.name);

console.log(top); // ["Алина", "Айдар", "Данияр"]`},
{id:"js3",d:"JavaScript",lv:3,h:2,t:"Валидация формы регистрации",s:"Проверка email и пароля с помощью регулярных выражений.",
 g:"Освоить регулярные выражения и обработку событий формы.",
 st:["Опишите регулярное выражение для email.","Пароль: минимум 8 символов, цифра и буква.","Верните массив ошибок.","Подключите проверку к событию submit."],
 c:String.raw`function validate(email, password) {
  const errors = [];
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRe.test(email)) errors.push("Некорректный email");
  if (password.length < 8) errors.push("Пароль короче 8 символов");
  if (!/\d/.test(password)) errors.push("Нужна хотя бы одна цифра");
  if (!/[A-Za-zА-Яа-я]/.test(password)) errors.push("Нужна хотя бы одна буква");
  return errors;
}

form.addEventListener("submit", e => {
  const errs = validate(email.value, password.value);
  if (errs.length) { e.preventDefault(); alert(errs.join("\n")); }
});`},
{id:"sql1",d:"SQL",lv:2,h:2,t:"Успеваемость по группам",s:"Запрос с JOIN и GROUP BY для среднего балла.",
 g:"Научиться соединять таблицы и использовать агрегатные функции.",
 st:["Таблицы: students, groups, grades.","Соедините их через JOIN.","Сгруппируйте по названию группы.","Отсортируйте по среднему баллу."],
 c:String.raw`SELECT g.name AS group_name,
       COUNT(DISTINCT s.id) AS students,
       ROUND(AVG(gr.value), 2) AS avg_grade
FROM groups g
JOIN students s ON s.group_id = g.id
JOIN grades gr  ON gr.student_id = s.id
GROUP BY g.name
HAVING AVG(gr.value) >= 3.5
ORDER BY avg_grade DESC;`},
{id:"sql2",d:"SQL",lv:1,h:1,t:"База данных «Библиотека»",s:"Создание таблиц со связями и тестовыми данными.",
 g:"Освоить CREATE TABLE, первичные и внешние ключи.",
 st:["Создайте таблицы authors и books.","Добавьте внешний ключ author_id.","Вставьте тестовые записи.","Выберите книги вместе с авторами."],
 c:String.raw`CREATE TABLE authors (
  id SERIAL PRIMARY KEY,
  full_name VARCHAR(100) NOT NULL
);

CREATE TABLE books (
  id SERIAL PRIMARY KEY,
  title VARCHAR(150) NOT NULL,
  year INT CHECK (year > 0),
  author_id INT REFERENCES authors(id) ON DELETE CASCADE
);

INSERT INTO authors (full_name) VALUES ('Абай Кунанбаев'), ('Мухтар Ауэзов');
INSERT INTO books (title, year, author_id) VALUES
  ('Слова назидания', 1904, 1),
  ('Путь Абая', 1942, 2);

SELECT b.title, a.full_name FROM books b
JOIN authors a ON a.id = b.author_id;`},
{id:"web1",d:"HTML/CSS",lv:1,h:1,t:"Адаптивная карточка курса",s:"Вёрстка карточки с помощью flexbox и медиазапросов.",
 g:"Закрепить flexbox, переменные CSS и адаптивность.",
 st:["Создайте разметку карточки.","Подключите стили через переменные.","Выровняйте элементы через flex.","Добавьте медиазапрос для телефонов."],
 c:String.raw`<article class="card">
  <h3>Основы программирования</h3>
  <p>72 часа · преподаватель Ибраев А.</p>
  <a class="btn" href="#">Подробнее</a>
</article>

<style>
  :root { --bg: #12151c; --accent: #7c8cff; }
  .card { display: flex; flex-direction: column; gap: 10px;
          background: var(--bg); color: #fff; padding: 20px;
          border-radius: 14px; max-width: 360px; }
  .btn { background: var(--accent); padding: 10px 16px;
         border-radius: 10px; text-align: center; color: #000; }
  @media (max-width: 480px) { .card { max-width: 100%; } }
</style>`},
{id:"py1",d:"Python",lv:1,h:1,t:"Подсчёт слов в тексте",s:"Частотный словарь слов с помощью dict и Counter.",
 g:"Научиться работать со строками, словарями и модулем collections.",
 st:["Приведите текст к нижнему регистру.","Уберите знаки препинания.","Разбейте на слова.","Выведите 3 самых частых слова."],
 c:String.raw`from collections import Counter
import re

text = "Python — это просто. Python — это удобно, а учиться просто."
words = re.findall(r"[а-яa-z]+", text.lower())

freq = Counter(words)
for word, count in freq.most_common(3):
    print(word, count)

# python 2
# это 2
# просто 2`},
{id:"py2",d:"Python",lv:3,h:3,t:"Учёт посещаемости",s:"Класс с методами и сохранением данных в CSV-файл.",
 g:"Применить ООП, работу с файлами и исключениями.",
 st:["Создайте класс Attendance.","Добавьте метод mark(student, present).","Реализуйте подсчёт процента посещаемости.","Сохраните данные в CSV."],
 c:String.raw`import csv

class Attendance:
    def __init__(self):
        self.records = {}

    def mark(self, student, present):
        self.records.setdefault(student, []).append(present)

    def percent(self, student):
        data = self.records.get(student, [])
        return round(sum(data) / len(data) * 100, 1) if data else 0.0

    def save(self, path):
        with open(path, "w", newline="", encoding="utf-8") as f:
            w = csv.writer(f)
            w.writerow(["student", "percent"])
            for s in self.records:
                w.writerow([s, self.percent(s)])

a = Attendance()
a.mark("Айдар", True); a.mark("Айдар", False); a.mark("Айдар", True)
print(a.percent("Айдар"))  # 66.7
a.save("attendance.csv")`}
];
const LV=["","Начальный","Средний","Сложный"],DS=["Все",...new Set(P.map(p=>p.d))];
let st={q:"",d:"Все",l:"0"},done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem("done")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("done",JSON.stringify([...done]))}catch(e){}};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const app=document.getElementById("app");

function prog(){
  document.getElementById("pt").textContent="Выполнено: "+done.size+" из "+P.length;
  document.getElementById("pb").style.width=(done.size/P.length*100)+"%";
}
function list(){
  const f=P.filter(p=>(st.d==="Все"||p.d===st.d)&&(st.l==="0"||p.lv==st.l)&&(p.t+p.s+p.d).toLowerCase().includes(st.q.toLowerCase()));
  document.getElementById("grid").innerHTML=f.length?f.map(p=>
   '<a class="card" href="#'+p.id+'"><div class="meta"><span class="tag">'+p.d+'</span><span class="lv-'+p.lv+'">● '+LV[p.lv]+'</span></div><h3>'+p.t+'</h3><p>'+p.s+'</p><div class="meta"><span>⏱ '+p.h+' ч.</span>'+(done.has(p.id)?'<span class="done">✓ Выполнено</span>':'')+'</div></a>'
  ).join(""):'<div class="empty">Ничего не найдено. Измените запрос или фильтры.</div>';
}
function home(){
  app.innerHTML='<section class="hero"><h1>Каталог учебных практик</h1><p class="sub">Практические задания по дисциплинам колледжа с пошаговым ходом работы и готовыми решениями.</p></section>'+
  '<div class="tools"><input id="q" placeholder="Поиск по названию или теме…" value="'+st.q+'"><select id="l"><option value="0">Любая сложность</option><option value="1">Начальный</option><option value="2">Средний</option><option value="3">Сложный</option></select></div>'+
  '<div class="chips" id="ch">'+DS.map(d=>'<button class="chip'+(d===st.d?' on':'')+'" data-d="'+d+'">'+d+'</button>').join("")+'</div><div class="grid" id="grid"></div>';
  document.getElementById("l").value=st.l;
  document.getElementById("q").oninput=e=>{st.q=e.target.value;list()};
  document.getElementById("l").onchange=e=>{st.l=e.target.value;list()};
  document.getElementById("ch").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;st.d=b.dataset.d;document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));list()};
  list();
}
function detail(p){
  app.innerHTML='<a class="back" href="#">← Назад в каталог</a>'+
  '<div class="meta" style="margin-bottom:8px"><span class="tag">'+p.d+'</span><span class="lv-'+p.lv+'">● '+LV[p.lv]+'</span><span>⏱ '+p.h+' ч.</span></div><h1>'+p.t+'</h1><p class="sub" style="margin-bottom:20px">'+p.s+'</p>'+
  '<div class="box"><h2>Цель работы</h2><p>'+p.g+'</p></div>'+
  '<div class="box"><h2>Ход выполнения</h2><ol>'+p.st.map(s=>'<li>'+s+'</li>').join("")+'</ol></div>'+
  '<div class="box"><h2>Готовое решение</h2><div class="row"><button class="btn ghost" id="cp">Скопировать код</button><button class="btn" id="dn"></button></div><div class="code"><pre><code>'+esc(p.c)+'</code></pre></div></div>';
  const dn=document.getElementById("dn"),sync=()=>dn.textContent=done.has(p.id)?"✓ Выполнено (снять)":"Отметить выполненной";
  sync();
  dn.onclick=()=>{done.has(p.id)?done.delete(p.id):done.add(p.id);save();sync();prog()};
  document.getElementById("cp").onclick=e=>{
    const b=e.target;
    (navigator.clipboard?navigator.clipboard.writeText(p.c):Promise.reject()).then(()=>b.textContent="Скопировано ✓").catch(()=>{const r=document.createRange();r.selectNodeContents(document.querySelector("code"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Выделено, нажмите Ctrl+C"});
    setTimeout(()=>b.textContent="Скопировать код",1800);
  };
}
function route(){
  const p=P.find(x=>x.id===location.hash.slice(1));
  p?detail(p):home();
  prog();window.scrollTo(0,0);
}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
